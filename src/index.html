<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Squad beyond クローン</title>
    <!-- 採取した実CSS（企画書 §11: 手書きで似せず verbatim で使う） -->
    <link rel="stylesheet" href="/assets/css/normalize.css" />
    <link rel="stylesheet" href="/assets/css/index-cb391eb6.css" />
    <link rel="stylesheet" href="/assets/css/material-icons.css" />
    <link rel="stylesheet" href="/assets/css/fontawesome-5.15.4.css" />
    <!-- Emotionのランタイムスタイル（CSSOMから採取したもの。これが無いとサイドバーが無地になる） -->
    <!--
      いずれも匿名化パイプラインを通した採取物をそのまま参照する。
      以前は capture/cssom/*.css という手で置いた複製を読んでいたが、
      これは scrub を通らないため、匿名化を直しても古いままだった
      （アセットのファイル名がトークンとして潰された参照が2件残っていた）。
    -->
    <!-- 採取した全画面のEmotion CSSを重複除去して統合（14.8MB→0.93MB・本番アップロード安定化）。
         元の画面別cssomは capture/clean 配下に保持。ルールは一切書き換えていない（union・忠実）。 -->
    <link rel="stylesheet" href="/clean/_merged/cssom.css" />
    <!--
      Emotionは「その状態で描かれた要素の分だけ」ルールを作るので、
      空アカウントの採取（editor-beyond-empty）にはVersion行のスタイルが入っていない
      （更新ボタンが無地になっていた）。Version有りの採取も併せて読む。
      互いに4件/12件ずつしか持たないクラスがあるため、両方必要。
    -->
    <!--
      基本情報タブ（/folders/:uid/ab_tests/:uid/edit）のEmotion。
      dashboard/editor/folders のどれにも入っていない（css-miex0u 等が全滅する）ので、
      採取済みの実ファイルを**そのまま**参照する（複製を増やさない）。
    -->
    <!--
      ポップアップタブ（/ab_tests/:uid/articles/exit_popups）のEmotion。
      上のどれにも入っていない5クラス（css-1ruxp1v / css-1ky2vci / css-3olzan /
      css-1t5yily / css-1afp10f）＝アップセルの暗い枠と見出しが全滅するので、
      採取済みの実ファイルを**そのまま**参照する（複製を増やさない）。
      editor.css と重なるルールは全て同一・@keyframes の衝突も0件（照合済み）。
    -->
    <!--
      リンクのドロップダウン（テキスト選択→鎖アイコン）と、文字色・背景色ピッカーのEmotion。
      editor.css に入っていないため、採取済みの実ファイルを**そのまま**参照する。
      以前は必要なルールをコード側のCSS文字列へ書き写していたが、
      再スクラブのたびに実物とズレるうえ、宣言の写し漏れで見た目が変わっていた
      （ホバー時の影が落ちていた）。写さずに実ファイルを読む。
    -->
    <!--
      エディタ内オーバーレイ4種のEmotion / CSS Modules。
      editor-target には入っていないクラス（MUI Popover の css-1ppmnxd、
      ヘッダー画像モーダルの _headerPhotoWrapper_1pk5s、ステップ追加の
      _funnelStepModal_rugej 等）が全滅するので、採取済みの実ファイルをそのまま参照する。
      Versionリンク popup は editor-target に既に入っているため追加不要。
    -->
    <!--
      レポートタブ（/ab_tests/:uid/reports）とヒートマップ
      （/ab_tests/:uid/articles/htmls/heatmaps/comparisons）のCSS。
      この2画面だけ**ダークテーマ**で、配色は CSS Modules の `_darkTheme_*` が持っている。
      上のどのファイルにも入っていない（_navWrapper_8ygjt_1 / _reportWrapper_1fhbq_152 /
      _heatmapList_14ri6_1 など）ので、採取済みの実ファイルを**そのまま**参照する。
      既存の5ファイルと重なる 4,609 / 4,581 ルールは宣言まで完全一致・@keyframes の衝突も0件（照合済み）。
    -->
    <link
      rel="stylesheet"
    />
    <!--
      Versionオプション設定（/ab_tests/:uid/articles/split_test_settings/:tab）のEmotion/CSS Modules。
      6タブは別ルートで、Emotionは「その状態で描かれた要素の分だけ」ルールを作るため、
      タブごとに固有の css-* が入る（デバイス別の表とキャリア別の表で要素が違う）。
      採取済みの実ファイルを**そのまま**タブ数ぶん参照する（複製を作らない・手書きしない）。
    -->
    <!--
      中間ページ（/folders/:folder_uid/ab_tests/:uid/redirect_pages）のEmotion/CSS Modules。
      `_redirectPagesWrapper_1tjuv_*` など、上のどのファイルにも入っていないので実ファイルを参照する。
    -->
    <link
      rel="stylesheet"
    />
    <!--
      サイドバー3画面（拡張機能 / タスク / AI）のEmotion/MUI/CSS Modules。
      それぞれ固有の css-* を持つ（拡張機能のMUIカタログ css-acxrf6 系、
      タスクのタブ css-1a9uxoy/css-djm0vw、AIチャットの css-8pm3ds/textarea 等）。
      上のどのファイルにも入っていないので、採取済みの実ファイルを**そのまま**参照する
      （複製を作らない・手書きしない）。サイドバー分の重複ルールは既存ファイルと同一。
    -->
    <!--
      ツール5画面（一括タグ / マジック置換 / メディア / 審査 / フォーム）のEmotion/MUI/CSS Modules。
      共通サブナビ＋各ページ固有の css-* / _*（マジック置換のドロップゾーン、メディアの
      _teamSearchFormsWrapper、審査のフォルダツリー MuiBox 等）が上のどのファイルにも
      入っていないので、採取済みの実ファイルを**そのまま**参照する（複製を作らない・手書きしない）。
    -->
    <style>
      body { margin: 0; background: #ECECEC; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app/main.ts"></script>
  </body>
</html>
